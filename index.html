<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_blank">
<meta charset="utf-8">
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#222; --mute:#6b6b6b; --line:#e4e1da; --accent:#b4532a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:13px; margin-bottom:16px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:12px; }
  .bar input[type=search], .bar select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:#fff; }
  .bar input[type=search] { flex:1; min-width:160px; }
  button { padding:7px 12px; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; font-size:14px; cursor:pointer; }
  button.ghost { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  label.auto { font-size:14px; display:flex; align-items:center; gap:6px; }
  .status { font-size:13px; color:var(--mute); margin:0 2px 10px; min-height:18px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; font-size:14px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#faf9f6; font-size:13px; color:var(--mute); cursor:pointer; user-select:none; white-space:nowrap; }
  th.sorted::after { content:attr(data-arrow); margin-left:4px; color:var(--accent); }
  td.id { color:var(--mute); width:56px; }
  td.time { white-space:nowrap; width:140px; color:var(--mute); }
  td a { color:var(--ink); text-decoration:none; }
  td a:hover { color:var(--accent); text-decoration:underline; }
  .empty { text-align:center; color:var(--mute); padding:36px 12px; }
  @media (max-width:640px) { th:nth-child(1), td.id { display:none; } td.time { width:auto; white-space:normal; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>飯店新聞追蹤</h1>
  <div class="sub">關鍵字：台北世聯商旅、梅樓驛站、府中棧精品商旅（含相關寫法）　資料來源：Google 新聞・每天早上 8 點自動更新</div>

  <div class="bar">
    <input type="search" id="q" placeholder="搜尋標題關鍵字…">
    <select id="media"><option value="">全部媒體</option></select>
    <select id="range">
      <option value="0">全部時間</option>
      <option value="7">近 7 天</option>
      <option value="30">近 30 天</option>
    </select>
    <label class="auto"><input type="checkbox" id="auto" checked> 自動更新
      <select id="every">
        <option value="1">每 1 分鐘</option>
        <option value="5" selected>每 5 分鐘</option>
        <option value="30">每 30 分鐘</option>
      </select>
    </label>
    <button class="ghost" id="reload">重新載入</button>
      </div>
  <div class="status" id="status"></div>

  <table>
    <thead>
      <tr>
        <th data-k="id">編號</th>
        <th data-k="ts" class="sorted" data-arrow="↓">日期時間</th>
        <th data-k="title">新聞內容</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
  var all = [];
  var sortKey = 'ts', sortDir = -1;
  var timer = null;
  var $ = function (id) { return document.getElementById(id); };

  function mediaOf(title) {
    var i = title.lastIndexOf(' - ');
    return i > -1 ? title.slice(i + 3).trim() : '';
  }

  function setStatus(msg) { $('status').textContent = msg; }

  function load(silent) {
    if (!silent) setStatus('載入中…');
    fetch('news.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) {
        all = d.news || [];
        buildMediaOptions();
        render();
        setStatus('共 ' + all.length + ' 則・資料更新時間：' + (d.updated || '尚未更新') + '・最後載入：' + new Date().toLocaleTimeString('zh-TW'));
      })
      .catch(function (e) { setStatus('載入失敗：' + e.message); });
  }

  function buildMediaOptions() {
    var sel = $('media'), cur = sel.value;
    var set = {};
    all.forEach(function (n) { var m = mediaOf(n.title); if (m) set[m] = true; });
    sel.innerHTML = '';
    var o = document.createElement('option'); o.value = ''; o.textContent = '全部媒體'; sel.appendChild(o);
    Object.keys(set).sort().forEach(function (m) {
      var op = document.createElement('option'); op.value = m; op.textContent = m; sel.appendChild(op);
    });
    sel.value = set[cur] ? cur : '';
  }

  function render() {
    var q = $('q').value.trim().toLowerCase();
    var media = $('media').value;
    var days = Number($('range').value);
    var cutoff = days ? Date.now() - days * 86400000 : 0;

    var list = all.filter(function (n) {
      return (!q || n.title.toLowerCase().indexOf(q) > -1) &&
             (!media || mediaOf(n.title) === media) &&
             (!cutoff || n.ts >= cutoff);
    });
    list.sort(function (a, b) {
      var x = a[sortKey], y = b[sortKey];
      return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
    });

    var tb = $('rows');
    tb.innerHTML = '';
    if (!list.length) {
      var tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 3; td.className = 'empty'; td.textContent = all.length ? '沒有符合條件的新聞' : '目前還沒有資料，等排程第一次執行後就會出現';
      tr.appendChild(td); tb.appendChild(tr); return;
    }
    list.forEach(function (n) {
      var tr = document.createElement('tr');
      var a = document.createElement('td'); a.className = 'id'; a.textContent = n.id;
      var b = document.createElement('td'); b.className = 'time'; b.textContent = n.time;
      var c = document.createElement('td');
      if (/^https:\/\//.test(n.link)) {
        var link = document.createElement('a'); link.href = n.link; link.rel = 'noopener'; link.textContent = n.title; c.appendChild(link);
      } else { c.textContent = n.title; }
      tr.appendChild(a); tr.appendChild(b); tr.appendChild(c); tb.appendChild(tr);
    });
  }

  function schedule() {
    if (timer) clearInterval(timer);
    timer = null;
    if ($('auto').checked) {
      timer = setInterval(function () { load(true); }, Number($('every').value) * 60000);
    }
  }

  document.querySelectorAll('th').forEach(function (th) {
    th.addEventListener('click', function () {
      var k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'title' ? 1 : -1; }
      document.querySelectorAll('th').forEach(function (x) { x.classList.remove('sorted'); });
      th.classList.add('sorted'); th.dataset.arrow = sortDir === 1 ? '↑' : '↓';
      render();
    });
  });
  ['q', 'media', 'range'].forEach(function (id) { $(id).addEventListener('input', render); });
  $('auto').addEventListener('change', schedule);
  $('every').addEventListener('change', schedule);
  $('reload').addEventListener('click', function () { load(false); });
  load(false);
  schedule();
</script>
</body>
</html>
